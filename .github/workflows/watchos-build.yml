
name: XM6 Wrist - free watchOS build

on:
  push:
  workflow_dispatch:

jobs:
  build-watchos:
    runs-on: macos-26
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Build Apple Watch app
        run: |
          xcodebuild \
            -project XM6Wrist.xcodeproj \
            -scheme XM6Wrist \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Save compiled simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XM6Wrist-Simulator
          path: ${{ runner.temp }}/Build/Build/Products/Debug-watchsimulator/XM6Wrist.app
